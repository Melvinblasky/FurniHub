{% extends "base.html" %}

{% block title %}
Login | FurniHub
{% endblock %}

{% block content %}

<section class="auth-page">

    <div class="auth-box">

        <h1>Welcome Back</h1>

        <p>
            Login to your FurniHub account.
        </p>

        {% if error %}
        <div class="auth-error">
            {{ error }}
        </div>
        {% endif %}


        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >

            </div>


            <button
                type="submit"
                class="auth-btn"
            >
                Login
            </button>

        </form>


        <p class="auth-switch">

            Don't have an account?

            <a href="{% url 'register' %}">
                Create Account
            </a>

        </p>

    </div>

</section>

{% endblock %}
